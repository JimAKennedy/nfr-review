name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COVERAGE_GIST_ID: ${{ vars.COVERAGE_GIST_ID }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Ruff check
        run: ruff check src/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format src/ tests/ --check --diff

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy
          pip install "ai-tooling @ git+https://github.com/TheCharlieKennedy/ai-tooling"

      - name: Run mypy
        run: mypy src/

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: bandit -r src/ -c pyproject.toml

  test-core:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-core-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-core-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run core tests
        run: |
          pytest -n auto -m "not regression" \
            --ignore=tests/test_java_ast_collector.py \
            --ignore=tests/test_java_deps_collector.py \
            --ignore=tests/test_java_rules.py \
            --ignore=tests/test_java_class_diagram.py \
            --ignore=tests/test_spring_config_collector.py \
            --ignore=tests/test_spring_rules.py \
            --ignore=tests/test_jacoco_coverage.py \
            --ignore=tests/test_jdepend_collector.py \
            --ignore=tests/test_jdepend_rules.py \
            --ignore=tests/test_jdepend_output.py \
            --ignore=tests/test_jdepend_adr_sections.py \
            --ignore=tests/test_go_ast_collector.py \
            --ignore=tests/test_go_deps_collector.py \
            --ignore=tests/test_go_rules.py \
            --ignore=tests/test_go_integration.py \
            --ignore=tests/test_go_class_diagram.py \
            --ignore=tests/test_rust_ast_collector.py \
            --ignore=tests/test_rust_deps_collector.py \
            --ignore=tests/test_rust_rules.py \
            --ignore=tests/test_rust_integration.py \
            --ignore=tests/test_rust_class_diagram.py \
            --ignore=tests/test_csharp_ast_collector.py \
            --ignore=tests/test_csharp_deps_collector.py \
            --ignore=tests/test_csharp_rules.py \
            --ignore=tests/test_csharp_integration.py \
            --ignore=tests/test_nodejs_ast_collector.py \
            --ignore=tests/test_nodejs_deps_collector.py \
            --ignore=tests/test_nodejs_rules.py \
            --ignore=tests/test_nodejs_integration.py \
            --ignore=tests/test_cpp_ast_collector.py \
            --ignore=tests/test_cpp_rules.py \
            --ignore=tests/test_cpp_dormant_classes.py \
            --ignore=tests/test_cpp_integration.py \
            --ignore=tests/test_cmake_rules.py \
            --ignore=tests/test_llm_client.py \
            --ignore=tests/test_s04_integration.py \
            --ignore=tests/test_pii_logging_rule.py \
            --ignore=tests/test_adr_drift_rule.py \
            --ignore=tests/test_adr_gap_rule.py \
            --cov --cov-report=term-missing --cov-report=xml \
            --junitxml=test-results.xml

      - name: Coverage threshold check
        run: coverage report --fail-under=88

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report-core
          path: coverage.xml
          retention-days: 14

      - name: Extract coverage percentage
        id: cov
        if: matrix.python-version == '3.12'
        run: |
          COV_PCT=$(coverage report --format=total)
          echo "pct=${COV_PCT}" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COV_PCT}%"

      - name: Update coverage badge
        if: >
          matrix.python-version == '3.12' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.COVERAGE_GIST_ID }}
          filename: nfr-review-coverage.json
          label: coverage
          message: "${{ steps.cov.outputs.pct }}%"
          valColorRange: ${{ steps.cov.outputs.pct }}
          minColorRange: 50
          maxColorRange: 90
          namedLogo: pytest

  test-lang-java:
    name: Test lang-java
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,lang-java]"

      - name: Run Java tests
        run: |
          pytest -n auto -m "not regression" \
            tests/test_java_ast_collector.py \
            tests/test_java_deps_collector.py \
            tests/test_java_rules.py \
            tests/test_java_class_diagram.py \
            tests/test_spring_config_collector.py \
            tests/test_spring_rules.py \
            tests/test_jacoco_coverage.py \
            tests/test_jdepend_collector.py \
            tests/test_jdepend_rules.py \
            tests/test_jdepend_output.py \
            tests/test_jdepend_adr_sections.py

  test-lang-go:
    name: Test lang-go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,lang-go]"

      - name: Run Go tests
        run: |
          pytest -n auto -m "not regression" \
            tests/test_go_ast_collector.py \
            tests/test_go_deps_collector.py \
            tests/test_go_rules.py \
            tests/test_go_integration.py \
            tests/test_go_class_diagram.py

  test-lang-rust:
    name: Test lang-rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,lang-rust]"

      - name: Run Rust tests
        run: |
          pytest -n auto -m "not regression" \
            tests/test_rust_ast_collector.py \
            tests/test_rust_deps_collector.py \
            tests/test_rust_rules.py \
            tests/test_rust_integration.py \
            tests/test_rust_class_diagram.py

  test-lang-csharp:
    name: Test lang-csharp
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,lang-csharp]"

      - name: Run C# tests
        run: |
          pytest -n auto -m "not regression" \
            tests/test_csharp_ast_collector.py \
            tests/test_csharp_deps_collector.py \
            tests/test_csharp_rules.py \
            tests/test_csharp_integration.py

  test-lang-nodejs:
    name: Test lang-nodejs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,lang-nodejs]"

      - name: Run Node.js tests
        run: |
          pytest -n auto -m "not regression" \
            tests/test_nodejs_ast_collector.py \
            tests/test_nodejs_deps_collector.py \
            tests/test_nodejs_rules.py \
            tests/test_nodejs_integration.py

  test-lang-cpp:
    name: Test lang-cpp
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,lang-cpp]"

      - name: Run C++ tests
        run: |
          pytest -n auto -m "not regression" \
            tests/test_cpp_ast_collector.py \
            tests/test_cpp_rules.py \
            tests/test_cpp_dormant_classes.py \
            tests/test_cpp_integration.py \
            tests/test_cmake_rules.py

  test-llm:
    name: Test LLM integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install "ai-tooling @ git+https://github.com/TheCharlieKennedy/ai-tooling"
          pip install tree-sitter-java

      - name: Run LLM integration tests
        run: |
          pytest -n auto -m "not regression" \
            tests/test_llm_client.py \
            tests/test_s04_integration.py \
            tests/test_pii_logging_rule.py \
            tests/test_adr_drift_rule.py \
            tests/test_adr_gap_rule.py

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pip-licenses

      - name: Check licenses
        run: |
          pip-licenses --from=mixed --allow-only='
            Apache Software License;
            Apache Software License; MIT License;
            Apache-2.0;
            Apache-2.0 OR BSD-2-Clause;
            BSD License;
            BSD-2-Clause;
            BSD-3-Clause;
            DFSG approved; MIT License;
            ISC License (ISCL);
            MIT;
            MIT License;
            Mozilla Public License 2.0 (MPL 2.0);
            PSF-2.0;
            Python Software Foundation License'

  doc-lint:
    name: Documentation Accuracy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[langs]"

      - name: Lint docs
        run: python scripts/lint_docs.py

  # Advisory job — requires GITLEAKS_LICENSE which is unavailable on fork PRs.
  # ci-complete does not gate on secrets-scan.result, so fork PRs are not blocked.
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  cve-scan:
    name: Docker CVE Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'requirements*.in'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nfr-review:cve-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy CVE scan
        if: steps.filter.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nfr-review:cve-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          scanners: vuln

      - name: Scan skipped
        if: steps.filter.outputs.docker != 'true'
        run: echo "No Docker-related files changed — CVE scan skipped"

  container-e2e:
    name: Container E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'requirements*.in'
              - 'src/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nfr-review:e2e-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: E2E — version check
        if: steps.filter.outputs.docker == 'true'
        run: |
          docker run --rm --entrypoint sh nfr-review:e2e-test \
            -c 'nfr-review --version'

      - name: E2E — fixture scan
        if: steps.filter.outputs.docker == 'true'
        run: |
          docker run --rm --entrypoint sh \
            -v "${{ github.workspace }}/tests/fixtures/cpp-integration-repo:/repo:ro" \
            -w /repo \
            nfr-review:e2e-test \
            -c 'nfr-review run --score --csv /tmp/out.csv --jsonl /tmp/out.jsonl .'

      - name: E2E skipped
        if: steps.filter.outputs.docker != 'true'
        run: echo "No container-relevant files changed — E2E test skipped"

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - security
      - test-core
      - test-lang-java
      - test-lang-go
      - test-lang-rust
      - test-lang-csharp
      - test-lang-nodejs
      - test-lang-cpp
      - test-llm
      - license-check
      - doc-lint
      - secrets-scan
      - cve-scan
      - container-e2e
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.typecheck.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ] || \
             [ "${{ needs.test-core.result }}" == "failure" ] || \
             [ "${{ needs.test-lang-java.result }}" == "failure" ] || \
             [ "${{ needs.test-lang-go.result }}" == "failure" ] || \
             [ "${{ needs.test-lang-rust.result }}" == "failure" ] || \
             [ "${{ needs.test-lang-csharp.result }}" == "failure" ] || \
             [ "${{ needs.test-lang-nodejs.result }}" == "failure" ] || \
             [ "${{ needs.test-lang-cpp.result }}" == "failure" ] || \
             [ "${{ needs.test-llm.result }}" == "failure" ] || \
             [ "${{ needs.license-check.result }}" == "failure" ] || \
             [ "${{ needs.doc-lint.result }}" == "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "All CI checks passed"

      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.typecheck.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test-core.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Java) | ${{ needs.test-lang-java.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Go) | ${{ needs.test-lang-go.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Rust) | ${{ needs.test-lang-rust.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (C#) | ${{ needs.test-lang-csharp.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (Node.js) | ${{ needs.test-lang-nodejs.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (C++) | ${{ needs.test-lang-cpp.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (LLM) | ${{ needs.test-llm.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-check.result == 'success' && '✓' || '✗' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result == 'success' && '✓' || '⚠' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker CVE Scan | ${{ needs.cve-scan.result == 'success' && '✓' || (needs.cve-scan.result == 'skipped' && '—' || '⚠') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container E2E | ${{ needs.container-e2e.result == 'success' && '✓' || (needs.container-e2e.result == 'skipped' && '—' || '⚠') }} |" >> $GITHUB_STEP_SUMMARY
